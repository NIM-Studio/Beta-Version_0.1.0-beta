<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="710" viewBox="0 0 1600 710" role="img" aria-labelledby="title desc">
<title id="title">NIM Studio open-source development roadmap</title>
<desc id="desc">April to July 2026 beta foundation; September 2026 through January 2027 internal evaluation, overlapping with November to December release preparation; January 2027 planned public source-code release.</desc>
<defs>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#6B38DE"/><stop offset="55%" stop-color="#2478E2"/><stop offset="100%" stop-color="#00B3D9"/>
</linearGradient>
<filter id="cardshadow" x="-12%" y="-20%" width="124%" height="150%">
<feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="#254678" flood-opacity=".075"/>
</filter>
</defs>
<rect x="0" y="0" width="1600" height="710" fill="#F8FAFE"/>
<rect x="0" y="0" width="1600" height="13" fill="url(#band)"/>
<text x="66" y="72" font-size="23" font-weight="700" letter-spacing="1.3" fill="#008EAE" font-family="Segoe UI, Arial, sans-serif">NIM STUDIO  /  DEVELOPMENT ROADMAP</text>
<text x="66" y="149" font-size="57" font-weight="750" fill="#112A49" font-family="Segoe UI, Arial, sans-serif">Open-source release roadmap</text>
<text x="66" y="197" font-size="26" fill="#546A83" font-family="Segoe UI, Arial, sans-serif">A local-first toolbox for reproducible scientific data organization</text>
<path d="M 230 316 H 1370" stroke="url(#band)" stroke-width="7" stroke-linecap="round"/>
<g font-family="Segoe UI, Arial, sans-serif"><g>
<text x="230" y="265" text-anchor="middle" font-size="26" font-weight="700" fill="#3D74D8">APR–JUL 2026</text>
<circle cx="230" cy="316" r="24" fill="white" stroke="#3D74D8" stroke-width="6"/>
<circle cx="230" cy="316" r="9" fill="#3D74D8"/>
<rect x="65" y="365" width="330" height="250" rx="24" fill="white" stroke="#DDE7F2" stroke-width="2" filter="url(#cardshadow)"/>
<rect x="87" y="389" width="145" height="34" rx="17" fill="#3D74D8" fill-opacity=".11"/>
<text x="159" y="413" text-anchor="middle" font-size="18" font-weight="700" fill="#3D74D8">ESTABLISHED</text>
<text x="87" y="467" font-size="28" font-weight="700" fill="#112A49">Beta foundation</text>
<path d="M 87 492 H 373" stroke="#E4EBF5" stroke-width="2"/>
<text x="87" y="532" font-size="22" fill="#53677E">Project and dataset tools</text>
<text x="87" y="568" font-size="22" fill="#53677E">BIDS, metadata and audits</text>
</g>
<g>
<text x="610" y="265" text-anchor="middle" font-size="24" font-weight="700" fill="#007FB5">SEP 2026–JAN 2027</text>
<circle cx="610" cy="316" r="24" fill="white" stroke="#007FB5" stroke-width="6"/>
<circle cx="610" cy="316" r="9" fill="#007FB5"/>
<rect x="445" y="365" width="330" height="250" rx="24" fill="white" stroke="#DDE7F2" stroke-width="2" filter="url(#cardshadow)"/>
<rect x="467" y="389" width="145" height="34" rx="17" fill="#007FB5" fill-opacity=".11"/>
<text x="539" y="413" text-anchor="middle" font-size="18" font-weight="700" fill="#007FB5">IN PROGRESS</text>
<text x="467" y="467" font-size="28" font-weight="700" fill="#112A49">Internal evaluation</text>
<path d="M 467 492 H 753" stroke="#E4EBF5" stroke-width="2"/>
<text x="467" y="532" font-size="22" fill="#53677E">Multimodal test datasets</text>
<text x="467" y="568" font-size="22" fill="#53677E">Usability and output checks</text>
</g>
<g>
<text x="990" y="265" text-anchor="middle" font-size="26" font-weight="700" fill="#6554C0">NOV–DEC 2026</text>
<circle cx="990" cy="316" r="24" fill="white" stroke="#6554C0" stroke-width="6"/>
<circle cx="990" cy="316" r="9" fill="#6554C0"/>
<rect x="825" y="365" width="330" height="250" rx="24" fill="white" stroke="#DDE7F2" stroke-width="2" filter="url(#cardshadow)"/>
<rect x="847" y="389" width="145" height="34" rx="17" fill="#6554C0" fill-opacity=".11"/>
<text x="919" y="413" text-anchor="middle" font-size="18" font-weight="700" fill="#6554C0">PLANNED</text>
<text x="847" y="467" font-size="28" font-weight="700" fill="#112A49">Release preparation</text>
<path d="M 847 492 H 1133" stroke="#E4EBF5" stroke-width="2"/>
<text x="847" y="532" font-size="22" fill="#53677E">Code audit and packaging</text>
<text x="847" y="568" font-size="22" fill="#53677E">Docs, licences and portability</text>
</g>
<g>
<text x="1370" y="265" text-anchor="middle" font-size="26" font-weight="700" fill="#6944DA">JAN 2027</text>
<circle cx="1370" cy="316" r="24" fill="white" stroke="#6944DA" stroke-width="6"/>
<circle cx="1370" cy="316" r="9" fill="#6944DA"/>
<rect x="1205" y="365" width="330" height="250" rx="24" fill="white" stroke="#DDE7F2" stroke-width="2" filter="url(#cardshadow)"/>
<rect x="1227" y="389" width="145" height="34" rx="17" fill="#6944DA" fill-opacity=".11"/>
<text x="1299" y="413" text-anchor="middle" font-size="18" font-weight="700" fill="#6944DA">TARGET</text>
<text x="1227" y="467" font-size="28" font-weight="700" fill="#112A49">Open-source release</text>
<path d="M 1227 492 H 1513" stroke="#E4EBF5" stroke-width="2"/>
<text x="1227" y="532" font-size="22" fill="#53677E">Planned Apache 2.0 source</text>
<text x="1227" y="568" font-size="22" fill="#53677E">Community contributions</text>
</g></g>
<path d="M 66 661 H 1534" stroke="#DDE7F2" stroke-width="2"/>
<text x="68" y="691" font-size="19" fill="#62768C" font-family="Segoe UI, Arial, sans-serif">Internal evaluation continues through January 2027; the public source-code release is a separate planned milestone.</text>
</svg>
