<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">NIM Studio — neuroinformatics data management</title>
  <desc id="desc">Editable vector recreation of the NIM Studio marquee: a neuron branching into data folders, with a purple-to-cyan NIM neural monogram and Studio wordmark on a transparent background.</desc>
  <defs>
    <linearGradient id="neon" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8A14FF"/>
      <stop offset="0.44" stop-color="#3159FF"/>
      <stop offset="1" stop-color="#03D6F2"/>
    </linearGradient>
    <linearGradient id="nerve" x1="0" x2="1" y1=".1" y2=".9">
      <stop offset="0" stop-color="#8E09FF"/>
      <stop offset="0.48" stop-color="#3855FD"/>
      <stop offset="1" stop-color="#01D7F1"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5923F6"/>
      <stop offset="0.48" stop-color="#1467FA"/>
      <stop offset="1" stop-color="#00DDF0"/>
    </linearGradient>
    <radialGradient id="soma" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#8F1CFF"/>
      <stop offset=".62" stop-color="#5719FF"/>
      <stop offset="1" stop-color="#1354FB"/>
    </radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#652CFF" stop-opacity=".65"/><stop offset="1" stop-color="#652CFF" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="data-folder">
      <path d="M5 20 Q5 10 17 10 H45 Q51 10 57 20 H89 Q99 20 99 32 L91 83 Q89 93 77 93 H11 Q2 93 2 83 Z" fill="url(#folder)" stroke="#7ACFFF" stroke-width="3" stroke-linejoin="round"/>
      <path d="M6 34 H94 L86 81 Q85 86 79 86 H14 Q8 86 8 81 Z" fill="#1180FF" fill-opacity=".26" stroke="#98EFFF" stroke-width="2"/>
      <path d="M22 76 L33 41" stroke="white" stroke-width="6" stroke-linecap="round" opacity=".86"/>
    </g>
  </defs>

  <!-- Transparent canvas: all artwork is vector geometry. -->
  <g opacity=".75" fill="#6D36FF">
    <circle cx="81" cy="340" r="8"/><circle cx="137" cy="465" r="7"/><circle cx="108" cy="634" r="6"/>
    <circle cx="299" cy="231" r="8"/><circle cx="403" cy="297" r="11"/><circle cx="465" cy="373" r="8"/>
    <circle cx="220" cy="740" r="10"/><circle cx="369" cy="737" r="6"/><circle cx="557" cy="661" r="8"/>
  </g>
  <g fill="#06C5F8" opacity=".82" filter="url(#softGlow)">
    <circle cx="535" cy="454" r="8"/><circle cx="666" cy="470" r="10"/><circle cx="748" cy="357" r="6"/>
    <circle cx="601" cy="699" r="9"/><circle cx="858" cy="604" r="7"/><circle cx="164" cy="318" r="6"/>
  </g>

  <!-- Neuronal branches, bundled pathways, and axon -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <g stroke="#7A1DFF" stroke-width="13">
      <path d="M252 493 C218 449 205 426 184 396 C158 362 134 361 120 340"/>
      <path d="M218 452 C177 456 157 438 129 414 C103 393 82 383 72 359"/>
      <path d="M220 466 C182 485 146 483 118 502 C93 518 79 541 49 552"/>
      <path d="M219 530 C175 553 153 565 122 593 C104 607 81 616 63 615"/>
      <path d="M267 422 C256 376 281 352 284 318 C287 283 275 258 270 241"/>
      <path d="M276 421 C307 394 332 384 344 352 C353 327 346 311 343 297"/>
      <path d="M268 568 C265 612 291 646 282 683 C277 710 254 726 248 751"/>
      <path d="M297 560 C337 592 350 618 362 652 C374 690 369 712 383 744"/>
      <path d="M253 564 C224 598 220 642 209 670 C202 689 179 716 166 737"/>
    </g>
    <g stroke="url(#neon)" stroke-width="12">
      <path d="M346 496 C405 498 459 497 508 489 C556 480 585 434 606 375 C618 344 644 334 683 334"/>
      <path d="M349 502 C448 504 507 517 557 493 C593 476 613 449 639 444 C663 439 692 443 733 443"/>
      <path d="M347 510 C469 510 545 513 626 511 C690 510 754 507 827 506"/>
      <path d="M342 518 C416 519 463 537 511 576 C557 614 584 653 646 655 C681 655 693 653 728 656"/>
      <path d="M335 527 C407 545 427 579 442 627 C452 660 485 698 537 707 C563 712 611 712 660 711"/>
    </g>
  </g>

  <ellipse cx="276" cy="504" rx="139" ry="139" fill="url(#halo)"/>
  <ellipse cx="281" cy="503" rx="101" ry="94" fill="url(#soma)" filter="url(#glow)"/>
  <circle cx="281" cy="503" r="43" fill="none" stroke="white" stroke-width="11" filter="url(#glow)"/>
  <circle cx="281" cy="503" r="23" fill="#4828D9"/>

  <g filter="url(#softGlow)">
    <use xlink:href="#data-folder" x="669" y="285" width="100" height="100"/>
    <use xlink:href="#data-folder" x="718" y="396" width="100" height="100"/>
    <use xlink:href="#data-folder" x="824" y="457" width="100" height="100"/>
    <use xlink:href="#data-folder" x="711" y="606" width="100" height="100"/>
    <use xlink:href="#data-folder" x="657" y="671" width="100" height="100"/>
  </g>

  <path d="M993 273 V730" stroke="url(#neon)" stroke-width="8" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M1008 280 V722" stroke="#73DEFF" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>

  <!-- NIM as a neuronal circuit, built from editable paths and nodes. -->
  <g fill="none" stroke="url(#neon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M1080 480 V317 L1215 481 V317"/>
    <path d="M1291 480 V317"/>
    <path d="M1368 480 V317 L1450 414 L1530 317 V480"/>
  </g>
  <g fill="white" stroke="url(#neon)" stroke-width="11">
    <circle cx="1080" cy="317" r="16"/><circle cx="1080" cy="480" r="16"/><circle cx="1215" cy="317" r="16"/><circle cx="1215" cy="481" r="16"/>
    <circle cx="1291" cy="317" r="16"/><circle cx="1291" cy="480" r="16"/>
    <circle cx="1368" cy="317" r="16"/><circle cx="1368" cy="480" r="16"/>
    <circle cx="1450" cy="414" r="16"/><circle cx="1530" cy="317" r="16"/><circle cx="1530" cy="480" r="16"/>
  </g>
  <g fill="none" stroke="url(#neon)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1080 301 C1077 269 1052 269 1053 246 M1080 301 C1093 274 1110 277 1115 252 M1080 290 L1082 238"/>
    <path d="M1215 302 C1201 271 1185 276 1183 252 M1215 299 C1227 268 1247 269 1247 245"/>
    <path d="M1291 300 C1272 271 1263 266 1266 242 M1291 300 C1311 268 1321 267 1321 246"/>
    <path d="M1368 301 C1354 272 1342 270 1344 244 M1368 298 C1387 271 1397 270 1397 242"/>
    <path d="M1530 301 C1514 275 1499 273 1500 246 M1530 299 C1546 273 1560 269 1561 241 M1530 288 L1531 238"/>
  </g>

  <text x="1050" y="650" fill="url(#neon)" font-family="Segoe UI, Arial, sans-serif" font-size="148" font-weight="680" letter-spacing="3">Studio</text>
  <path d="M1053 669 H1581" stroke="url(#neon)" stroke-width="8" stroke-linecap="round" filter="url(#softGlow)"/>
  <text x="1055" y="729" fill="#277AF4" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="1.4">STRUCTURING NEUROIMAGING</text>
  <text x="1055" y="771" fill="#287DF3" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="650" letter-spacing=".7">RESEARCH DATA ASSETS MADE EASY.</text>
</svg>
