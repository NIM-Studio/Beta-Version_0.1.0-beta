<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">NIM Studio modules</title>
  <desc id="desc">Editable vector overview of six NIM Studio task modules: Research Project Builder, BIDS Dataset Builder, BIDS Transformer, Metadata Builder, Duplicate Audit, and Data Governance Intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#041221"/><stop offset=".53" stop-color="#020811"/><stop offset="1" stop-color="#100A20"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#1BE8ED"/><stop offset=".48" stop-color="#43B6FF"/><stop offset="1" stop-color="#9277FF"/></linearGradient>
    <linearGradient id="leftColor" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10BED4"/><stop offset="1" stop-color="#4BCDFE"/></linearGradient>
    <linearGradient id="rightColor" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#709BFF"/><stop offset="1" stop-color="#AA81FF"/></linearGradient>
    <radialGradient id="centerFill"><stop stop-color="#10213B"/><stop offset="1" stop-color="#061020"/></radialGradient>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse"><path d="M96 0 H0 V96" fill="none" stroke="#57708D" stroke-width=".7" opacity=".15"/></pattern>
    <filter id="blueGlow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="5" result="a"/><feMerge><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="violetGlow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="4" result="a"/><feMerge><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="node"><circle r="6" fill="#092036" stroke="#53CFFA" stroke-width="2"/><circle r="2.5" fill="#B5FBFF"/></g>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <!-- Discreet orbital points give depth without raster textures. -->
  <g fill="#15BEE8" opacity=".5"><circle cx="40" cy="246" r="1.8"/><circle cx="40" cy="580" r="1.5"/><circle cx="519" cy="102" r="1.4"/><circle cx="749" cy="91" r="1.4"/><circle cx="1226" cy="54" r="1.5"/><circle cx="1245" cy="655" r="1.8"/><circle cx="1150" cy="665" r="1.2"/><circle cx="626" cy="668" r="1.3"/><circle cx="301" cy="42" r="1.5"/></g>

  <!-- Module cards -->
  <g stroke-width="1.7">
    <rect x="80" y="67" width="333" height="160" rx="24" fill="#04131E" fill-opacity=".96" stroke="#57DDF0"/>
    <rect x="80" y="280" width="333" height="154" rx="23" fill="#04131E" fill-opacity=".96" stroke="#44A9F4"/>
    <rect x="80" y="490" width="333" height="153" rx="23" fill="#04131E" fill-opacity=".96" stroke="#3AA6FF"/>
    <rect x="867" y="67" width="333" height="160" rx="24" fill="#080D1B" fill-opacity=".96" stroke="#A292F4"/>
    <rect x="867" y="280" width="333" height="154" rx="23" fill="#080D1B" fill-opacity=".96" stroke="#9A74FE"/>
    <rect x="867" y="490" width="333" height="153" rx="23" fill="#080D1B" fill-opacity=".96" stroke="#8E79E8"/>
  </g>

  <!-- Connectors: their ends are visible behind the center hub. -->
  <g fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#blueGlow)">
    <path d="M413 146 H464 L539 227" stroke="#49CFFC"/>
    <path d="M413 357 H475" stroke="#36D4F9"/>
    <path d="M413 567 H463 L539 482" stroke="#49B9FB"/>
    <path d="M741 227 L817 146 H867" stroke="#998FFE"/>
    <path d="M807 357 H867" stroke="#9E83FF"/>
    <path d="M740 482 L819 567 H867" stroke="#998AFE"/>
  </g>
  <g filter="url(#violetGlow)">
    <use href="#node" x="413" y="146"/><use href="#node" x="413" y="357"/><use href="#node" x="413" y="567"/>
    <use href="#node" x="867" y="146"/><use href="#node" x="867" y="357"/><use href="#node" x="867" y="567"/>
    <circle cx="539" cy="227" r="8" fill="#031929" stroke="#53E4FC" stroke-width="3"/>
    <circle cx="539" cy="482" r="8" fill="#031929" stroke="#53C9FF" stroke-width="3"/>
    <circle cx="741" cy="227" r="8" fill="#111129" stroke="#AD9CFF" stroke-width="3"/>
    <circle cx="740" cy="482" r="8" fill="#111129" stroke="#AD9CFF" stroke-width="3"/>
  </g>

  <!-- Center console: layered octagonal rings -->
  <path d="M640 199 L747 240 L803 350 L748 463 L640 512 L531 462 L476 350 L530 240 Z" fill="#07172C" fill-opacity=".82" stroke="url(#rim)" stroke-width="7" filter="url(#blueGlow)"/>
  <path d="M640 217 L735 253 L784 351 L735 449 L640 492 L545 448 L496 350 L545 252 Z" fill="url(#centerFill)" stroke="url(#rim)" stroke-opacity=".6" stroke-width="2.5"/>

  <!-- Center monogram and subtitle -->
  <g fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M533 375 V289 L589 375 V289"/>
    <path d="M621 375 V289"/>
    <path d="M654 375 V289 L690 346 L727 289 V375"/>
  </g>
  <g fill="white"><circle cx="533" cy="375" r="6"/><circle cx="533" cy="289" r="6"/><circle cx="589" cy="375" r="6"/><circle cx="589" cy="289" r="6"/><circle cx="621" cy="375" r="6"/><circle cx="621" cy="289" r="6"/><circle cx="654" cy="375" r="6"/><circle cx="654" cy="289" r="6"/><circle cx="690" cy="346" r="6"/><circle cx="727" cy="375" r="6"/><circle cx="727" cy="289" r="6"/></g>
  <g stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M533 285 Q523 272 523 259 M533 285 Q543 269 545 254"/>
    <path d="M589 286 Q577 269 577 258 M589 285 Q601 270 601 258"/>
    <path d="M654 284 Q644 270 645 259 M654 284 Q666 272 665 256"/>
    <path d="M727 285 Q714 271 713 257 M727 285 Q738 268 738 258"/>
  </g>
  <text x="640" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="760" fill="white" text-anchor="middle" letter-spacing=".2">Studio</text>
  <text x="640" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#C9D7E7" text-anchor="middle">Neuro Informatics Management Studio</text>

  <!-- Left icon: project tree -->
  <g stroke="#2FDCF4" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M134 93 H164 L172 101 H194 Q198 101 198 105 V139 Q198 145 192 145 H139 Q134 145 134 140 Z"/>
    <path d="M164 145 V159 H113 V173 M164 159 H215 V173 M164 159 V173" stroke-dasharray="4 4"/>
    <rect x="102" y="173" width="24" height="22" rx="3"/><rect x="152" y="173" width="24" height="22" rx="3"/><rect x="202" y="173" width="24" height="22" rx="3"/>
  </g>
  <!-- Left icon: dataset with modality tiles -->
  <g stroke="#2FCFED" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="161" cy="302" rx="19" ry="8"/><path d="M142 302 V332 Q161 346 180 332 V302 M142 314 Q161 329 180 314"/>
    <path d="M161 341 V357 H115 V371 M161 357 H208 V371"/>
    <rect x="102" y="372" width="26" height="31" rx="2"/><rect x="151" y="372" width="26" height="31" rx="2"/><rect x="199" y="372" width="26" height="31" rx="2"/>
    <path d="M107 392 H122 M156 393 L162 386 L171 395 M204 386 L207 391 L211 383 L215 393 L219 385"/>
  </g>
  <!-- Left icon: transformation routing -->
  <g stroke="#43A5FF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="110" cy="532" r="5"/><circle cx="110" cy="565" r="5"/><circle cx="110" cy="598" r="5"/>
    <path d="M120 532 H141 Q163 532 175 555 Q185 578 216 578 H224 M120 565 H141 Q167 565 174 543 Q180 527 221 527 M120 598 H148 Q167 598 177 578 Q187 558 221 558"/>
    <path d="M215 520 L224 527 L215 534 M215 551 L224 558 L215 565 M215 571 L224 578 L215 585"/>
  </g>
  <!-- Right icon: metadata file -->
  <g stroke="#967FFC" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M913 94 H962 L985 119 V200 H913 Q909 200 909 195 V99 Q909 94 913 94 Z"/>
    <path d="M962 94 V119 H985 M923 136 H969 M923 147 H960"/>
    <path d="M927 158 Q920 163 927 170 Q934 176 927 183 M962 158 Q969 163 962 170 Q955 176 962 183"/>
  </g>
  <!-- Right icon: duplicate review sheets and fingerprint rings -->
  <g stroke="#9576FF" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M908 305 H956 L972 322 V384 H908 Z M956 305 V322 H972 M916 335 H951 M916 349 H948"/>
    <path d="M920 320 H961 L981 340" opacity=".5"/>
    <circle cx="967" cy="373" r="38" fill="#070F1F"/>
    <path d="M945 372 C946 353 963 349 975 356 C989 364 983 377 983 386 M952 389 C954 379 949 369 963 363 C977 357 987 375 977 396 M963 392 C965 378 959 373 968 371 C978 369 975 382 971 389"/>
  </g>
  <!-- Right icon: governance network and shield -->
  <g stroke="#54D4EB" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="944" cy="512" r="7"/><circle cx="902" cy="544" r="7"/><circle cx="987" cy="544" r="7"/>
    <circle cx="902" cy="600" r="7"/><circle cx="987" cy="600" r="7"/><circle cx="944" cy="630" r="7"/>
    <path d="M944 519 L909 542 M951 517 L981 542 M902 551 V593 M987 551 V593 M909 603 L939 627 M980 603 L949 627"/>
    <path d="M944 541 L969 551 V580 Q965 594 944 607 Q921 595 919 580 V551 Z"/>
    <path d="M932 574 L941 583 L958 564" stroke-width="3.5"/>
  </g>

  <!-- Legible labels: all native text, individually editable. -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="440" fill="#F0F6FE">
    <text x="260" y="121">Research</text><text x="260" y="151">Project</text><text x="260" y="181">Builder</text>
    <text x="260" y="328">BIDS</text><text x="260" y="358">Dataset</text><text x="260" y="388">Builder</text>
    <text x="260" y="554">BIDS</text><text x="260" y="584">Transformer</text>
    <text x="1025" y="138">Metadata</text><text x="1025" y="168">Builder</text>
    <text x="1025" y="343">Duplicate</text><text x="1025" y="373">Audit</text>
    <text x="1025" y="551">Data</text><text x="1025" y="581">Governance</text><text x="1025" y="611">Intelligence</text>
  </g>
</svg>
